name: arabic-bot

services:
  bot:
    build: .
    image: arabic-bot:latest
    container_name: arabic-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      # БД, кэш озвучки и картинок переживают пересборку образа
      - arabic-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import pathlib,sys,time; p=pathlib.Path('/data/heartbeat'); sys.exit(0 if p.exists() and time.time()-p.stat().st_mtime < 180 else 1)"
      interval: 60s
      timeout: 10s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  arabic-data:
