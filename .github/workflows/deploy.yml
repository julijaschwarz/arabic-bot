name: Тесты и деплой

# Только push в main и запуск вручную. Триггера pull_request здесь быть не должно:
# репозиторий публичный, и через форк можно было бы добраться до секретов деплоя.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  deploy:
    name: Деплой на сервер
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Обновить бота на сервере
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # На сервере ключ привязан к forced command (~/deploy.sh) — что бы сюда
          # ни передали, выполнится только скрипт обновления.
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o IdentitiesOnly=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" deploy
