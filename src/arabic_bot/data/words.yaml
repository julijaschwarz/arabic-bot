# Лексикон для заданий на распознавание букв.
#
# Сами задания генерируются программно, но слова должны быть настоящими —
# поэтому список курируемый. Комбинации «слово × буква × тип задания» дают
# тысячи неповторяющихся упражнений.
#
# Чтобы добавить слова, допишите строки — код менять не нужно.
#   w  — написание без огласовок
#   t  — транслитерация
#   ru — перевод

